name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.lock
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: python -m venv agent/.venv
      - run: agent/.venv/bin/python -m pip install --disable-pip-version-check -r agent/requirements.lock pip-audit==2.10.1
      - run: scripts/install-local-emulators.sh
      - name: Verify exact source revision
        env:
          RELEASE_EVIDENCE_DIR: .artifacts/release-${{ github.sha }}
        run: scripts/release-verify.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: source-verification-${{ github.sha }}
          path: .artifacts/release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30

  image-scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: Dockerfile
          - name: worker
            context: agent
            file: agent/Dockerfile
          - name: cognition
            context: agent
            file: agent/Dockerfile.agentcore
          - name: scanner
            context: infra/malware-scanner
            file: infra/malware-scanner/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build local ${{ matrix.name }} image
        run: |
          mkdir -p ".artifacts/image-scan-${{ github.sha }}"
          docker build --load --label "org.opencontainers.image.revision=${{ github.sha }}" --file "${{ matrix.file }}" --tag "harmonia-${{ matrix.name }}:${{ github.sha }}" "${{ matrix.context }}"
          docker image inspect --format='{{json .Id}}' "harmonia-${{ matrix.name }}:${{ github.sha }}" > ".artifacts/image-scan-${{ github.sha }}/${{ matrix.name }}-image-digest.json"
      - name: Scan ${{ matrix.name }} for critical and high CVEs
        uses: docker/scout-action@481412c8b8de36d0f79e85aa382c60397466feb6 # v1
        with:
          command: cves
          image: local://harmonia-${{ matrix.name }}:${{ github.sha }}
          only-severities: critical,high
          exit-code: true
          sarif-file: .artifacts/image-scan-${{ github.sha }}/${{ matrix.name }}-cves.sarif.json
          write-comment: false
      - name: Generate ${{ matrix.name }} image SBOM
        if: always()
        uses: docker/scout-action@481412c8b8de36d0f79e85aa382c60397466feb6 # v1
        with:
          command: sbom
          image: local://harmonia-${{ matrix.name }}:${{ github.sha }}
          format: cyclonedx
          output: .artifacts/image-scan-${{ github.sha }}/${{ matrix.name }}-sbom.cdx.json
          write-comment: false
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: image-scan-${{ matrix.name }}-${{ github.sha }}
          path: .artifacts/image-scan-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
