name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      agentcore_image_uri:
        description: Immutable ECR image URI for the reviewed ARM64 AgentCore cognition image
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: harmonia-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.lock
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: python -m venv agent/.venv
      - run: agent/.venv/bin/python -m pip install --disable-pip-version-check -r agent/requirements.lock pip-audit==2.10.1
      - run: scripts/install-local-emulators.sh
      - name: Verify exact source revision
        env:
          RELEASE_EVIDENCE_DIR: .artifacts/release-${{ github.sha }}
        run: scripts/release-verify.sh
      - uses: aws-actions/configure-aws-credentials@463133d79af6d001e45482f356e244208e65f0c5 # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy reviewed digest to staging
        env:
          HARMONIA_ALLOW_PAID_DEPLOYMENT: "true"
          AGENTCORE_IMAGE_URI: ${{ inputs.agentcore_image_uri }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: infra/deploy.sh --context stage=staging
