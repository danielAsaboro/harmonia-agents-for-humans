name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERNAL_API_TOKEN: ci-only-not-a-live-secret
      AGENT_SERVICE_URL: http://127.0.0.1:8080
      GOOGLE_CLOUD_PROJECT: harmonia-ci
      HARMONIA_CONNECTION_ENVELOPE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.lock
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: python -m venv agent/.venv
      - run: agent/.venv/bin/python -m pip install --disable-pip-version-check -r agent/requirements.lock pip-audit==2.10.1
      - run: scripts/install-local-emulators.sh
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:agent
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run infra:synth
      - run: npm audit --omit=dev --audit-level=high
      - run: agent/.venv/bin/python -m pip_audit -r agent/requirements.lock --cache-dir .artifacts/pip-audit-cache
      - run: npm run security:sbom -- .artifacts/sbom-${{ github.sha }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: source-sbom-${{ github.sha }}
          path: .artifacts/sbom-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
